# partition name, offset, size
# 1st part: fw region 0 (default)
fw0     0x0001D000  0x00180000
# 2nd part: fw region 1 (backup)
fw1     0x0019D000  0x00043000
# 3nd part: xnn wgt
xnn_wgt   0x001E0000  0x00D00000
# 4nd part: face db
face_db     0x00EE0000  0x00100000
# 5th part: file system
fs  0x00FE0000  0x00020000
